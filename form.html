<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AltSchool Form</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html">Login</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form>
        <h1>Sign in</h1>
        <p>
          Enter your email address and password to securely log in to AltSchool
          Student Portal
        </p>
        <p>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="johndoe@example.com"
            required
          />
        </p>
        <p>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            required
          />
        </p>
        <button type="submit">Proceed to dashboard --&gt;</button>
      </form>
      <section>
        <p>Forgot your password?<a href="">Reset Now!</a></p>
        <p>------------- OR -------------</p>
        <p>
          <a href="">Login with Google</a>
        </p>
      </section>
    </main>
    <footer>
      <address>
        Contact me at
        <a href="mailto:bilaaleadaem@gmail.com">bilaaleadaem@gmail.com</a>
      </address>
      <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
  </body>
</html>
